---
- name: Install PostgreSQL listening on all interfaces
  hosts: customer-database
  remote_user: ubuntu
  become: true

  vars:
    ansible_pipelining: true   # avoids temp-file permission issues when becoming postgres
    pg_port: 5432
    pg_admin_user: pgadmin
    # This is just a demo, don't commit your password to git. Use a secret manager!
    pg_admin_password: pgadmin

  tasks:
    - name: Install PostgreSQL
      ansible.builtin.apt:
        name:
          - postgresql
          - postgresql-contrib
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Find installed PostgreSQL version
      ansible.builtin.find:
        paths: /etc/postgresql
        file_type: directory
        recurse: false
      register: pg_version_dirs

    - name: Set PostgreSQL config path
      ansible.builtin.set_fact:
        pg_conf_dir: "/etc/postgresql/{{ pg_version_dirs.files | map(attribute='path') | map('basename') | map('int') | max }}/main"

    - name: Listen on all interfaces
      ansible.builtin.copy:
        dest: "{{ pg_conf_dir }}/conf.d/10-listen.conf"
        owner: postgres
        group: postgres
        mode: "0644"
        # Wouldn't usually listen on all interfaces, but for this demo
        # it makes life easier.
        content: |
          # Managed by Ansible
          listen_addresses = '*'
          port = {{ pg_port }}
      notify: Restart PostgreSQL

    - name: Allow password auth from any address
      ansible.builtin.blockinfile:
        path: "{{ pg_conf_dir }}/pg_hba.conf"
        marker: "# {mark} ANSIBLE MANAGED - remote access"
        block: |
          host    all    all    0.0.0.0/0    scram-sha-256
          host    all    all    ::/0         scram-sha-256
      notify: Restart PostgreSQL

    - name: Enable and start PostgreSQL
      ansible.builtin.systemd:
        name: postgresql
        enabled: true
        state: started

    - name: Apply config changes before creating roles
      ansible.builtin.meta: flush_handlers

    - name: Create administrator role
      become_user: postgres
      community.postgresql.postgresql_user:
        name: "{{ pg_admin_user }}"
        password: "{{ pg_admin_password }}"
        role_attr_flags: LOGIN,SUPERUSER
        state: present
      #no_log: true

  handlers:
    - name: Restart PostgreSQL
      ansible.builtin.systemd:
        name: postgresql
        state: restarted
